name: secrets-scan

# Layer 3 of the kb-driven secrets-scan defense (per docs/local/secrets-scan-design/).
# Re-runs the same scripts/secrets-scan.mjs as the local husky pre-commit hook (layer 2),
# acting as the server-side backstop if the hook was bypassed or absent.
#
# Note: the CI runner does NOT have access to the private watchlist directory, so kb-derived watchlist
# matches will be skipped. Only the structural regex (Windows/POSIX absolute paths,
# RFC1918 private IPs) runs on this side. Layer 2 catches kb-derived leaks locally;
# layer 4 (release skill) runs against the full kb on the release machine.

on:
  push:
    branches:
      - main
      - develop
      - 'hotfix/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  scan:
    name: scan tracked files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # このリポは --all-tracked ではなく --files-from-diff を使う。
      # 公開済みの過去記事に、技術記事として意図的に書いた Windows パス 19 件と
      # 架空メール 2 件、著者の姓 1 件（公開名義）が残っているため、全走査だと
      # 毎回赤になる。ゲートの目的は「これから入るものを止める」ことなので、
      # 変更されたファイルだけを見る。過去分の棚卸しは別途 --all-tracked --dry-run で行う。
      - name: Run secrets-scan (structural only on CI; kb not available)
        run: node scripts/secrets-scan.mjs --files-from-diff --block

      # ---- strict doxguard 0.2.0 gate, beside the legacy gate above ----
      # NOTE: the legacy step above diffs the working tree against HEAD. On a fresh CI checkout
      # that is always empty, so it scans 0 files. The steps below build the real change list
      # (PR base or push "before" against HEAD) and give the SAME list to both scanners.

      - name: Resolve exact public scanner package
        run: |
          npm install --prefix "$RUNNER_TEMP/doxguard-ci" --ignore-scripts --include=optional --package-lock=false --no-save doxguard@0.2.0 > "$RUNNER_TEMP/doxguard-install.log" 2>&1 || { echo 'Exact doxguard 0.2.0 package unavailable; failing closed.'; exit 1; }

      - name: Test strict native positive and negative controls
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DOXGUARD_PACKAGE_ROOT: ${{ runner.temp }}/doxguard-ci/node_modules/doxguard
        run: node scripts/secrets-scan.dual.mjs --controls

      - name: Build changed-file list
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          head=$(git rev-parse HEAD)
          if [ "$EVENT_NAME" = pull_request ]; then
            base=$(git merge-base "$PR_BASE_SHA" "$head")
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE_SHA"
          else
            # new branch or force push: compare with the default branch, else the parent commit
            base=$(git merge-base origin/main "$head" 2>/dev/null || true)
            if [ -z "$base" ] || [ "$base" = "$head" ]; then base=$(git rev-parse "$head~1"); fi
          fi
          echo "compare base: $base"
          echo "$base" > "$RUNNER_TEMP/scan-base"
          git -c core.quotepath=false diff --name-only --diff-filter=ACM "$base" "$head" > "$RUNNER_TEMP/changed.list"
          echo "changed files: $(wc -l < "$RUNNER_TEMP/changed.list")"

      - name: Run strict doxguard scan on the changed files
        env:
          DOXGUARD_PACKAGE_ROOT: ${{ runner.temp }}/doxguard-ci/node_modules/doxguard
        run: |
          set -eu
          if [ ! -s "$RUNNER_TEMP/changed.list" ]; then
            # Same as the legacy gate: 0 changed files is a pass, but it is not a scan. Say so.
            echo 'NOTICE: 0 changed files; strict scan not run (same outcome as the legacy gate).'
            exit 0
          fi
          node "$DOXGUARD_PACKAGE_ROOT/bin/doxguard.js" scan --path-from "$RUNNER_TEMP/changed.list" --block --strict --config doxguard.ci.json

      - name: Run legacy scan on the same changed files
        if: ${{ !cancelled() }}
        run: |
          set -eu
          if [ ! -s "$RUNNER_TEMP/changed.list" ]; then echo 'NOTICE: 0 changed files; legacy scan not run.'; exit 0; fi
          # Move HEAD (not the files) to the compare base so "diff against HEAD" is the change set.
          git reset --soft "$(cat "$RUNNER_TEMP/scan-base")"
          node scripts/secrets-scan.mjs --files-from-diff --block
