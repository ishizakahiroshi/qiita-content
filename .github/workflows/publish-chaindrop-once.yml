name: Publish ChainDrop article once

on:
  schedule:
    # 13:50 JST. The workflow removes itself after the first successful publish.
    - cron: "50 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-chaindrop-once
  cancel-in-progress: false

jobs:
  publish_once:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish articles to Qiita
        uses: increments/qiita-cli/actions/publish@v1
        with:
          qiita-token: ${{ secrets.QIITA_TOKEN }}
          root: "."

      - name: Remove this one-time retry workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/20260805-npm-chaindrop.md
          git rm .github/workflows/publish-chaindrop-once.yml
          git commit -m "chore: remove completed Qiita retry workflow [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
