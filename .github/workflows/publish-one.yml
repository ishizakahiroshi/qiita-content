name: Update the reviewed CVSS article summary link

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Reviewed commit on wt/cvss-summary-20261102 (40 lowercase hex)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qiita-update-c80ae9066a01dbf9b1be
  cancel-in-progress: false

jobs:
  update_existing_article:
    if: github.ref == 'refs/heads/wt/cvss-summary-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Validate reviewed branch and commit
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = 'ishizakahiroshi/qiita-content'
          test "$GITHUB_REF" = 'refs/heads/wt/cvss-summary-20261102'
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
      - name: Install the pinned CLI in runner temporary storage
        run: npm install --prefix "$RUNNER_TEMP/cvss-qiita-cli" --ignore-scripts --no-audit --no-fund @qiita/qiita-cli@1.10.0
      - name: Guard, update one existing item, and read it back
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        shell: node {0}
        run: |
          (async () => {
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const cp = require('node:child_process');
          const basename = 'cvss-vulnerability-triage-20261102';
          const itemId = 'c80ae9066a01dbf9b1be';
          const account = 'ishizakahiroshi';
          const title = 'CVSS 10.0を見つけた一般エンジニアが、全社対応を背負わずに脆弱性をトリアージする方法';
          const summary = 'https://ishizakahiroshi.com/articles/2026/2026-11-02_cvss-vulnerability-triage-responsibilities/';
          const originalHash = 'ebb436271da972c3302dfa9e831c2e05807d37fe8d1b42288d3274953de4aeb0';
          const pendingHash = '55841b2a71e3b34acb84e03db51f636813fd389b0df0ff161683b1cd586d82c9';
          const hash = value => crypto.createHash('sha256').update(value).digest('hex');
          const out = path.join(process.env.RUNNER_TEMP, 'cvss-qiita-receipt');
          fs.mkdirSync(out, {recursive:true});
          const receipt = {item_id:itemId, source_sha:process.env.REVIEWED_SHA, state:'not-started', published:false, operation:'update-existing-item-only'};
          const save = () => fs.writeFileSync(path.join(out, 'receipt.json'), JSON.stringify(receipt, null, 2) + '\n');
          const stop = code => { const e = new Error(code); e.safeCode = code; throw e; };
          const api = async route => {
            const response = await fetch(`https://qiita.com/api/v2/${route}`, {headers:{Authorization:`Bearer ${process.env.QIITA_TOKEN}`}});
            if (!response.ok) stop(`read-http-${response.status}`);
            return response.json();
          };
          const images = body => [...body.matchAll(/!\[[^\]]*\]\((https:\/\/[^\s)]+)\)/g)].map(m => m[1]);
          const tagNames = item => item.tags.map(t => t.name).sort();
          const assertItem = item => {
            if (item.id !== itemId || item.user?.id !== account || item.title !== title || item.private !== false) stop('item-identity-or-visibility-mismatch');
          };
          save();
          try {
            if (!process.env.QIITA_TOKEN) stop('token-unavailable');
            const tools = path.join(process.env.RUNNER_TEMP, 'cvss-qiita-cli');
            const matter = require(path.join(tools, 'node_modules/gray-matter'));
            const input = matter(fs.readFileSync(path.join('public', basename + '.md'), 'utf8'));
            if (!input.data.id || input.data.id !== itemId || input.data.private !== false || input.data.ignorePublish !== false || input.data.title !== title) stop('local-existing-item-guard-failed');
            if (hash(input.content) !== pendingHash) stop('reviewed-update-body-mismatch');
            const bodyImages = images(input.content);
            if (bodyImages.length !== 8 || new Set(bodyImages).size !== 8 || bodyImages.some(u => !u.startsWith('https://qiita-image-store.s3.ap-northeast-1.amazonaws.com/'))) stop('eight-existing-cdn-images-required');
            if (input.content.split(summary).length !== 2) stop('exactly-one-summary-link-required');
            const user = await api('authenticated_user');
            if (user.id !== account) stop('authenticated-account-mismatch');
            const before = await api('items/' + itemId);
            assertItem(before);
            receipt.before_body_sha256 = hash(before.body);
            if (receipt.before_body_sha256 !== originalHash) stop('public-body-changed-since-review');
            if (JSON.stringify(images(before.body)) !== JSON.stringify(bodyImages)) stop('original-image-order-mismatch');
            if (JSON.stringify([...input.data.tags].sort()) !== JSON.stringify(tagNames(before))) stop('existing-tags-mismatch');
            const root = path.join(process.env.RUNNER_TEMP, 'cvss-qiita-one-root');
            fs.mkdirSync(path.join(root, 'public'), {recursive:true});
            fs.writeFileSync(path.join(root, 'qiita.config.json'), JSON.stringify({includePrivate:false}));
            const localPath = path.join(root, 'public', basename + '.md');
            fs.writeFileSync(localPath, matter.stringify(input.content, {...input.data, updated_at:before.updated_at}));
            const local = matter(fs.readFileSync(localPath, 'utf8'));
            if (local.data.id !== itemId || hash(local.content) !== pendingHash) stop('isolated-input-mismatch');
            receipt.state = 'update-starting';
            receipt.pending_body_sha256 = pendingHash;
            receipt.before_updated_at = before.updated_at;
            save();
            const cli = path.join(tools, 'node_modules/@qiita/qiita-cli/dist/main.js');
            const result = cp.spawnSync(process.execPath, [cli, 'publish', basename, '--root', root, '--config', root], {env:process.env, encoding:'utf8', timeout:180000});
            if (result.status !== 0) stop('single-item-cli-failed-result-unknown');
            const written = matter(fs.readFileSync(localPath, 'utf8'));
            if (written.data.id !== itemId) stop('cli-item-id-changed');
            const after = await api('items/' + itemId);
            assertItem(after);
            if (hash(after.body) !== pendingHash || after.body !== input.content) stop('updated-body-mismatch');
            if (!after.body.includes(summary) || JSON.stringify(images(after.body)) !== JSON.stringify(bodyImages)) stop('updated-summary-or-image-mismatch');
            if (JSON.stringify(tagNames(after)) !== JSON.stringify(tagNames(before))) stop('updated-tags-mismatch');
            receipt.state = 'verified-update';
            receipt.published = true;
            receipt.created_new_item = false;
            receipt.url = `https://qiita.com/${account}/items/${itemId}`;
            receipt.after_body_sha256 = hash(after.body);
            receipt.after_updated_at = after.updated_at;
            receipt.image_count = bodyImages.length;
            receipt.summary_url = summary;
            save();
            console.log('Verified the summary link update for the fixed existing item.');
          } catch (error) {
            receipt.failure = error.safeCode || 'unexpected-runner-error';
            receipt.previous_state = receipt.state;
            receipt.state = receipt.previous_state === 'update-starting' ? 'update-result-unknown' : 'stopped';
            save();
            console.error(receipt.failure);
            process.exitCode = 1;
          }
          })().catch(() => { console.error('runner-startup-failed'); process.exitCode = 1; });
      - name: Retain the update receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cvss-summary-update-${{ github.run_id }}
          path: ${{ runner.temp }}/cvss-qiita-receipt/receipt.json
          if-no-files-found: warn
          retention-days: 7
